name: Deploy site to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: checkbook-project-507911
  WORKLOAD_IDENTITY_PROVIDER: projects/243974982019/locations/global/workloadIdentityPools/github-id-pool/providers/github-provider
  # Can only deploy Firebase Hosting, and only this repo may use it (see CLAUDE.md).
  SERVICE_ACCOUNT: fivechip-web-deployer@checkbook-project-507911.iam.gserviceaccount.com
  FIREBASE_TOOLS_VERSION: 15.31.0

permissions:
  contents: read
  id-token: write # required for requesting the OIDC token used by WIF

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deploy gate: never ship a build that fails type-checking.
      - name: Type-check and build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      # firebase.json is hosting-only, so this deploy can never touch Firestore rules or indexes.
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy --only hosting --project ${{ env.PROJECT_ID }} --non-interactive
